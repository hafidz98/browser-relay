name: Build

on:
  push:
    branches:
      - core
    tags:
      - "v*"
      - "android-v*"
  pull_request:
    branches:
      - core
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback on every push/PR: check + clippy + unit tests.
  # --no-default-features drops the eframe GUI binary (Linux runners
  # have no X11 link libs); relay-nogui + the relay modules still
  # compile and test there.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: Check
        run: cargo check --no-default-features
        working-directory: shell

      - name: Clippy
        run: cargo clippy --no-default-features
        working-directory: shell

      - name: Unit tests
        run: cargo test --no-default-features
        working-directory: shell

      # The web client is plain JS served as a static file - a syntax
      # error there breaks the phone client without any Rust failing.
      - name: Check web client script
        run: node --check shell/assets/client/app.js

  # The GUI binary (src/main.rs) needs the eframe/tray-icon feature
  # set, which the Linux ci job drops (--no-default-features). Compile
  # it on Windows on every push so panel code is never verified only
  # at release time.
  gui-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: Check (GUI)
        run: cargo check
        working-directory: shell

  windows-exe:
    # Tag push builds the release binary; manual dispatch builds it
    # from any branch so the pipeline can be tested without a tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: Build release
        run: cargo build --release
        working-directory: shell

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $version = (Select-String -Path shell/Cargo.toml -Pattern '^version = "([^"]+)"').Matches.Groups[1].Value
          Copy-Item "shell/target/release/browser-relay-shell.exe" "relay-$version.exe"
          "version=$version" >> $env:GITHUB_OUTPUT

      # Upload the exact file we just built - a glob ("relay-*.exe")
      # also picks up stale binaries that are committed in the repo.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: relay-windows
          path: relay-${{ steps.pkg.outputs.version }}.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: relay-${{ steps.pkg.outputs.version }}.exe
          generate_release_notes: true

  android-apk:
    # The APK is built on every push, so a broken Android change fails
    # the build instead of waiting for the next release.
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Cache the Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_SDK_ROOT }}
          key: android-sdk-${{ runner.os }}

      - name: Install platform + build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          bash android/build.sh 25 2.5

      # The server serves the APK as /app.apk from a file called
      # browser-relay.apk, so give the artifact that exact name.
      - name: Name the APK
        run: mv android/browserrelay-*.apk android/browser-relay.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: browserrelay-apk
          path: android/browser-relay.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/browser-relay.apk
          fail_on_unmatched_files: false
