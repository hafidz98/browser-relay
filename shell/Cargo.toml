[package]
name = "browser-relay-shell"
version = "0.9.57"
edition = "2021"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:tray-icon", "dep:qrcode", "dep:raw-window-handle"]

[[bin]]
name = "browser-relay-shell"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "relay-nogui"
path = "src/bin/relay-nogui.rs"

[dependencies]
eframe = { version = "0.32", optional = true }
tray-icon = { version = "0.21", optional = true }
qrcode = { version = "0.14", optional = true }
raw-window-handle = { version = "0.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs", "signal"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
arboard = "3"
if-addrs = "0.14"
rand = "0.9"

[profile.release]
opt-level = 2

[build-dependencies]
embed-resource = "2"
